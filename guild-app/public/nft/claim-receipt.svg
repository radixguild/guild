  <text x="256" y="456" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#e2e8f0" fill-opacity="0.82" text-anchor="middle">CLAIM</text>
