<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Radix Guild NFT icon: Guild Marketplace claim receipt. Source for public/nft/claim-receipt.png, the file the
       resource's icon_url names. Re-render the PNG from this file with
       guild-app/scripts/render-nft-icons.mjs (Playwright's Chromium, 512 x 512).
       Text is limited to two short labels in the system sans; no emoji. -->
  <defs>
