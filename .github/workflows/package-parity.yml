name: Package parity

# Rebuilds each live Scrypto package listed in verify/deployed-packages.json from this repository
# and compares the bytes with the code the package runs on the Radix ledger. The recipe is
# docs/AUDITOR-GUIDE.md section 5; anyone with a Linux machine can repeat it by hand.
#
# Read-only: it reads the public Gateway and crates.io, uses no secrets, signs nothing, sends no
# transaction and touches no server.
#
# Its own workflow, not a job in scrypto.yml, so that file's jobs and their check names stay as
# they are. Not a required check: it is path-filtered on pull requests, so a PR that touches none
# of its paths never reports it.

on:
  push:
    branches: [main]
    paths:
      - 'escrow/scrypto/guild-marketplace-escrow/**'
      - 'verify/**'
      - 'scripts/verify-package-parity.mjs'
      - .github/workflows/package-parity.yml
  pull_request:
    paths:
      - 'escrow/scrypto/guild-marketplace-escrow/**'
      - 'verify/**'
      - 'scripts/verify-package-parity.mjs'
      - .github/workflows/package-parity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The recipe. Changing either changes the bytes; verify/deployed-packages.json records the same.
  RUST_VERSION: 1.92.0
  RADIX_CLIS_VERSION: 1.3.1

jobs:
  # The chain still runs the recorded bytes: Gateway code -> blake2b self-check -> sha256 vs the file.
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deployed code matches the recorded hashes
        run: |
          node --version
          node scripts/verify-package-parity.mjs
      - id: plan
        name: one rebuild per package in the expected-hash file
        run: |
          node -e '
            const m = require("./verify/deployed-packages.json")
            const include = m.packages.map((p) => ({ id: p.id, address: p.address, enforce: p.enforce === true }))
            console.log("matrix=" + JSON.stringify({ include }))
          ' >> "$GITHUB_OUTPUT"

  rebuild:
    needs: chain
    runs-on: ubuntu-latest
    # A cold radix-clis compile has taken 17-37 minutes elsewhere in this fleet; the package build
    # adds a few. 75 minutes caps a hang without cutting off a cold run.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.chain.outputs.matrix) }}
    env:
      PKG_ID: ${{ matrix.id }}
      PKG_ADDRESS: ${{ matrix.address }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The deployed wasm embeds source paths under /root/.cargo and /root/.rustup (panic location
      # strings), so the build must use those two homes. The runner's own user owns them here; no
      # step runs as root after this one.
      - name: build homes at /root/.cargo and /root/.rustup
        run: |
          set -euo pipefail
          sudo mkdir -p /root/.cargo/bin /root/.rustup
          sudo chown -R "$(id -u):$(id -g)" /root/.cargo /root/.rustup
          sudo chmod o+x /root
          {
            echo "CARGO_HOME=/root/.cargo"
            echo "RUSTUP_HOME=/root/.rustup"
          } >> "$GITHUB_ENV"
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      # rustup is preinstalled on the runner; it downloads and checks the toolchain from
      # static.rust-lang.org. The package's rust-toolchain.toml names the same version.
      - name: Rust toolchain (pinned)
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rust-src --component rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc --version && cargo --version

      # Caches only the CLI binary, never the package build output.
      - name: cache the scrypto CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /root/.cargo/bin
            /root/.cargo/.crates.toml
            /root/.cargo/.crates2.json
          key: radix-clis-${{ runner.os }}-${{ env.RADIX_CLIS_VERSION }}-rust-${{ env.RUST_VERSION }}-root

      - name: scrypto CLI (radix-clis, pinned, --locked)
        timeout-minutes: 50
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if command -v scrypto >/dev/null && scrypto --version | grep -q "$RADIX_CLIS_VERSION"; then
            echo "scrypto CLI from cache"
          else
            cargo install radix-clis --version "$RADIX_CLIS_VERSION" --locked
          fi
          scrypto --version

      - name: rebuild
        run: verify/rebuild-package.sh "$PKG_ID" out

      # enforce=true in verify/deployed-packages.json (a package already proven) fails the run on a
      # mismatch; a package not yet proven only reports.
      - id: compare
        name: built bytes == chain bytes == recorded hash
        continue-on-error: ${{ !matrix.enforce }}
        run: node scripts/verify-package-parity.mjs --package "$PKG_ADDRESS" --wasm "out/$PKG_ID.wasm"

      - name: report-only mismatch
        if: steps.compare.outcome == 'failure'
        run: echo "::warning::$PKG_ID did not match; reported only (enforce is false for this package)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rebuild-${{ matrix.id }}
          path: |
            out/${{ matrix.id }}.wasm
            out/${{ matrix.id }}.rpd
            out/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
