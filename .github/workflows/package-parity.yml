name: Package parity

# Rebuilds each live Scrypto package listed in verify/deployed-packages.json from this repository
# and compares the bytes with the code the package runs on the Radix ledger. The recipe is
# docs/AUDITOR-GUIDE.md section 5; anyone with a Linux machine can repeat it by hand.
#
# Read-only: it reads the public Gateway and crates.io, uses no secrets, signs nothing, sends no
# transaction and touches no server.
#
# Its own workflow, not a job in scrypto.yml, so that file's jobs and their check names stay as
# they are. The check to require on main is `package parity gate` (the last job): it reports on
# every pull request, as formal.yml's and scrypto.yml's gates do.

on:
  pull_request:
    # No paths filter: a path-filtered workflow never reports on a PR that misses its paths, so it
    # could not be required. The `changes` job below decides whether the real jobs run.
  push:
    branches: [main]
    paths:
      - 'escrow/scrypto/guild-marketplace-escrow/**'
      - 'verify/**'
      - 'scripts/verify-package-parity.mjs'
      - '.cargo/**'
      - .github/workflows/package-parity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The recipe. Changing either changes the bytes; verify/deployed-packages.json records the same.
  RUST_VERSION: 1.92.0
  RADIX_CLIS_VERSION: 1.3.1

jobs:
  # Change detection for `package parity gate` below. Every PR runs this cheap job; the chain and
  # rebuild jobs skip when nothing they check changed, and the gate still reports.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: did this change touch the paths this workflow checks?
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The crate stays watched although the rebuild reads it at the pinned source_commit, so a
          # crate edit still shows this workflow run. A root .cargo/ config would apply to the
          # build (it runs inside the checkout), so it is watched too.
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- \
            ':(glob)escrow/scrypto/guild-marketplace-escrow/**' ':(glob)verify/**' \
            scripts/verify-package-parity.mjs ':(glob).cargo/**' .github/workflows/package-parity.yml)"
          if [ -n "$changed" ]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"
          printf 'relevant files changed:\n%s\n' "${changed:-(none)}"

  # The chain still runs the recorded bytes: Gateway code -> blake2b self-check -> sha256 vs the file.
  # Then each package's pinned source is checked (no build): source_commit holds the recorded blobs.
  chain:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: deployed code matches the recorded hashes
        run: |
          node --version
          node scripts/verify-package-parity.mjs
      - name: every package's source_commit holds its recorded source
        run: |
          set -euo pipefail
          for id in $(node -e 'for (const p of require("./verify/deployed-packages.json").packages) console.log(p.id)'); do
            verify/rebuild-package.sh --prepare-only "$id" "$RUNNER_TEMP/prepare"
          done
      - id: plan
        name: one rebuild per package in the expected-hash file
        run: |
          node -e '
            const m = require("./verify/deployed-packages.json")
            const include = m.packages.map((p) => ({ id: p.id, address: p.address, enforce: p.enforce === true }))
            console.log("matrix=" + JSON.stringify({ include }))
          ' >> "$GITHUB_OUTPUT"

  rebuild:
    needs: [changes, chain]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A cold radix-clis compile has taken 17-37 minutes elsewhere in this fleet; the package build
    # adds a few. 75 minutes caps a hang without cutting off a cold run.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.chain.outputs.matrix) }}
    env:
      PKG_ID: ${{ matrix.id }}
      PKG_ADDRESS: ${{ matrix.address }}
    steps:
      # Full history: rebuild-package.sh reads the crate at the package's pinned source_commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The deployed wasm embeds source paths under /root/.cargo and /root/.rustup (panic location
      # strings), so the build must use those two homes. The runner's own user owns them here; no
      # step runs as root after this one.
      - name: build homes at /root/.cargo and /root/.rustup
        run: |
          set -euo pipefail
          sudo mkdir -p /root/.cargo/bin /root/.rustup
          sudo chown -R "$(id -u):$(id -g)" /root/.cargo /root/.rustup
          sudo chmod o+x /root
          {
            echo "CARGO_HOME=/root/.cargo"
            echo "RUSTUP_HOME=/root/.rustup"
          } >> "$GITHUB_ENV"
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      # rustup is preinstalled on the runner; it downloads and checks the toolchain from
      # static.rust-lang.org. The package's rust-toolchain.toml names the same version.
      - name: Rust toolchain (pinned)
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rust-src --component rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc --version && cargo --version

      # Caches only the CLI binary, never the package build output.
      - name: cache the scrypto CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /root/.cargo/bin
            /root/.cargo/.crates.toml
            /root/.cargo/.crates2.json
          key: radix-clis-${{ runner.os }}-${{ env.RADIX_CLIS_VERSION }}-rust-${{ env.RUST_VERSION }}-root

      - name: scrypto CLI (radix-clis, pinned, --locked)
        timeout-minutes: 50
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if command -v scrypto >/dev/null && scrypto --version | grep -q "$RADIX_CLIS_VERSION"; then
            echo "scrypto CLI from cache"
          else
            cargo install radix-clis --version "$RADIX_CLIS_VERSION" --locked
          fi
          scrypto --version

      - name: rebuild
        run: verify/rebuild-package.sh "$PKG_ID" out

      # enforce=true in verify/deployed-packages.json (a package already proven) fails the run on a
      # mismatch; a package not yet proven only reports.
      - id: compare
        name: built bytes == chain bytes == recorded hash
        continue-on-error: ${{ !matrix.enforce }}
        run: node scripts/verify-package-parity.mjs --package "$PKG_ADDRESS" --wasm "out/$PKG_ID.wasm"

      - name: report-only mismatch
        if: steps.compare.outcome == 'failure'
        run: echo "::warning::$PKG_ID did not match; reported only (enforce is false for this package)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rebuild-${{ matrix.id }}
          path: |
            out/${{ matrix.id }}.wasm
            out/${{ matrix.id }}.rpd
            out/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30

  # The one check to require on main. It runs for every PR (`if: always()`) and fails unless change
  # detection succeeded and every job above either passed or was skipped because this PR touched
  # none of the watched paths. Requiring a rebuild job by name instead would let a broken `changes`
  # job skip it silently, and a skipped matrix job reports under a name a required check never
  # matches. A report-only package (enforce false) passes its rebuild job with a warning.
  gate:
    name: package parity gate
    if: always()
    needs: [changes, chain, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed, or was skipped for an unrelated change
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = "success" ] || { echo "::error::change detection ended: $CHANGES"; exit 1; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job in this workflow ended: $r"; exit 1 ;;
            esac
          done
          echo "ok: $RESULTS"
