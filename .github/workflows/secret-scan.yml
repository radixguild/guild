name: secret-scan

# Secret-scanning guardrail. In a public repository a merged commit is published
# the moment it lands, so this scan is a hard prerequisite of every merge.
# Scans the FULL git history on every PR and every push to main. Config lives in
# .gitleaks.toml (baseline verified clean 2026-07-15). Mirrors the local
# lefthook pre-commit hook so nothing that trips locally sails through CI.
#
# This workflow was written in the private repository this one was exported
# from (see PROVENANCE.md): the PR numbers, branch names and billing figures in
# the comments below are that repository's.

on:
  # No branch filter on pull_request so stacked PRs (base = another feature
  # branch) get scanned too — matches test.yml.
  pull_request:
  push:
    branches: [main]
  # Coverage gap this closes: a stacked PR's BASE branch (e.g.
  # chore/charter-cull-and-doc-cleanse, base of #479/#480/#481) has no open PR
  # of its own once its original PR closes, so a direct push to it fires
  # neither `pull_request` above nor `push: [main]` — it goes unscanned until
  # something re-triggers this workflow by hand. Observed 2026-09-02: #479's
  # gitleaks status was a stale SUCCESS from the previous day, predating ~20
  # unscanned commits on its base.
  #
  # Fix chosen: workflow_dispatch, not an automatic push trigger on
  # chore/**|docs/**|feat/**|fix/** branch globs. That alternative was
  # considered and rejected on cost: chore/charter-cull-and-doc-cleanse alone
  # was a long-lived branch already 100+ commits ahead of main, and per the
  # project's state record at the time this repo was ~80% of the account's
  # Actions bill, as a private repo billed per job rounded UP to a whole
  # minute — an automatic glob trigger would double-bill every push to a
  # branch that ALSO has an open PR (already
  # covered by `pull_request` above) just to cover the rarer case where it
  # doesn't. workflow_dispatch costs nothing unless invoked, and is the
  # correct tool for "rescan this specific base, on demand" — e.g. before
  # merging a stack, or right after a stack's target lands on main. This is a
  # process lever, not an automatic guarantee: nothing currently reminds a
  # human to press it. Re-close this gap for real with either a scheduled
  # sweep or a bot that dispatches this workflow against every open PR's base
  # branch — out of scope here.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned + checksum-verified below. Bump in lockstep with the local install
      # (brew) and .gitleaks.toml's documented version.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — gitleaks scans every commit, not just the diff.
          fetch-depth: 0

      - name: refuse to scan a shallow clone (fail closed)
        # --log-opts=HEAD below scopes gitleaks to commits reachable from HEAD
        # instead of gitleaks' default of every ref the checkout pulled down
        # (see the scan step). That is only equivalent to a full history scan
        # because `fetch-depth: 0` above makes HEAD's own history complete. If
        # depth were ever shallowed — a future edit to this file, an org-wide
        # actions/checkout default change, anything that touches those ~20
        # lines without touching this one — `--log-opts=HEAD` would walk
        # whatever few commits a shallow clone happens to hold, gitleaks would
        # report "0 leaks" having examined almost nothing, and the job would go
        # green having proven nothing. That exact shape (a commit-then-remove
        # secret invisible to a shallow scan) is what PR #483 demonstrated.
        # This step makes that failure loud instead of silent, and runs it
        # BEFORE installing gitleaks so a shallow checkout fails in seconds
        # rather than after a download. It checks the actual property the scan
        # below depends on, not the fetch-depth config, so it still catches a
        # shallowing that arrives some other way.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::This checkout is SHALLOW. gitleaks git --log-opts=HEAD only sees commits present locally, so a shallow clone reports a false '0 leaks' instead of failing — exactly the vacuous pass PR #483 demonstrated. Fix: restore 'fetch-depth: 0' on the checkout step above. Refusing to run the scan." >&2
            exit 1
          fi

      - name: install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan git history
        # Exits non-zero if any secret is found (default exit code 1). --redact
        # keeps real secret values out of the public CI logs. --log-opts=HEAD
        # scopes the walk to commits reachable from HEAD — on pull_request,
        # checkout gives us refs/pull/N/merge, so that is the PR's commits plus
        # the whole base branch: every commit that could reach main is still
        # scanned, in full, every time. What it stops scanning is UNMERGED
        # SIBLING branches, which gitleaks' default (every ref fetch-depth: 0
        # pulled down) otherwise walks too — the reason a single bad commit on
        # one branch previously failed every unrelated open PR at once
        # (chore/charter-cull-and-doc-cleanse's test fixture red on #481, #482,
        # #483 and #484 simultaneously, 2026-09-02, none of which contained the
        # offending line). Preceded by the shallow-clone guard above, which is
        # what keeps this scoping from ever running unchecked against a
        # truncated history.
        #
        # CAVEAT, deliberately left open: in a public repository every pushed
        # ref is public, not only main. This scoping covers what can reach
        # main; a branch pushed here without a pull request fires no trigger
        # above, so this workflow never scans it. When that matters, sweep all
        # refs by hand:
        #   gitleaks git -c .gitleaks.toml   (no --log-opts)
        run: gitleaks git --no-banner --redact -c .gitleaks.toml --log-opts=HEAD
