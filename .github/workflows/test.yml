# Generated by publish/gen-ci-public-test.mjs: the public-snapshot trim of the private
# development repository's .github/workflows/test.yml (publish/CI-PUBLIC.md, ruling N3 #4
# and the rows added since). In that repository this text is publish/ci-public-test.yml:
# never hand-edit it there, because `--check` and guild-app/tests/unit/workflow-runners.test.ts
# fail when it is stale. The export writes it as .github/workflows/test.yml of the repository
# it creates; there it was generated once, at the export, and from then on it is the source:
# edit it directly.
#
# Everything below is that test.yml verbatim, except the PUBLIC-SNAPSHOT TRIM comments,
# each of which replaces one job or step. So the comments copied from it describe the
# private repository: its billing, its branch protection, and the jobs trimmed here (docs,
# publish gate). Trims applied:
#   - job `unit`: step "instantiate gate (sheet ↔ generator ↔ blueprint)" removed.
#   - job `unit`: step "method catalog gate (inventory ↔ blueprint ABI)" removed.
#   - job `agent-client`: step "the one-liner — npx -y -p <tarball over HTTP> guild-agent, and its sha256" removed.
#   - job `agent-mcp`: step "the one-liner — npx -y -p <tarball over HTTP> guild-mcp, and its sha256" removed.
#   - job `publish-gate`: removed whole.
#   - job `docs`: removed whole.
name: test

on:
  # No branch filter on pull_request: stacked PRs (base = another feature
  # branch, e.g. the #157→#158→#159 chain) must get CI too, not only after
  # they retarget to main.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The e2e scope step calls `gh api .../pulls/N/files`. The repo default workflow
# token grants only contents/metadata/packages: read, and that endpoint on a
# PRIVATE repo needs `pull-requests: read` — without it the call 403s, the step
# fails OPEN, and the saving is silently zero. Found by an adversarial screen
# 2026-08-17, which noted the step was built so a working detector and a dead
# one print the same line. Declared explicitly here (pii-scan.yml and
# secret-scan.yml already declare their own).
permissions:
  contents: read
  pull-requests: read

# ── Why some jobs say `ubuntu-slim` ───────────────────────────────────────────
# Private-repo Actions minutes are billed PER JOB, ROUNDED UP to a whole minute.
# So a job's cost is driven by its runner RATE and its job COUNT, not by how
# long it actually runs — a 7-second job and a 59-second job cost exactly the
# same. Measured over a complete window (2026-08-13..14, 75 runs / 312 jobs):
# 426 billed minutes against 209 minutes of real work — 51% of the bill was
# round-up on jobs that had already finished.
#
# The jobs below marked `ubuntu-slim` all average UNDER 21 SECONDS:
#   docs 6.6s · identity/PII 8.6s · agent-mcp 11.1s · agent-client 13.4s
#   publish gate 18.3s
# ubuntu-slim (1 core / 5 GB) bills $0.002/min vs ubuntu-latest's $0.006 — a 3x
# rate cut. It is slower, and that is FINE here and provable rather than hoped:
# a job has to get 3x slower before it costs more, and these have ~40 seconds of
# headroom inside their first (already-paid-for) minute.
#
# What deliberately did NOT move, so nobody "finishes the job" and breaks it:
#   • playwright e2e — needs a postgres SERVICE CONTAINER; slim runs unprivileged.
#   • gitleaks (secret-scan.yml) — its install does `sudo mv` into /usr/local/bin.
#   • lint / unit / build — 40-99s each. Already past the first minute, so the
#     round-up saving is zero, and a 1-core slowdown would add billed minutes.
# Keep the job NAMES identical when editing. The branch rules on main require
# several of them by name, and a required check that never reports leaves every
# PR stuck on "Expected — waiting for status" for it, as "syntax check (bot)"
# did after the bot/ decommission of 2026-09-03 left no job to produce it, until
# it was dropped from the rules. Which names are required is set per repository,
# so this file states no count: read the branch rules (`gh api
# repos/{owner}/{repo}/branches/main/protection`, or the repository's rulesets)
# before renaming a job, and change both in the same sitting. (A count used to
# live here and in the e2e job below, and the copies drifted apart after each
# change; guild-app/tests/unit/workflow-runners.test.ts now fails if a count
# comes back.)
jobs:
  lint:
    name: lint (guild-app)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md

      - name: install
        working-directory: guild-app
        run: bun install --frozen-lockfile

      - name: eslint
        working-directory: guild-app
        run: bun run lint

  unit:
    name: unit + integration (guild-app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md

      - name: install
        working-directory: guild-app
        run: bun install --frozen-lockfile

      # tests/unit/poster-env-preflight.test.ts runs the REAL poster-signing
      # scripts under bun, and four of them import ../../packages/agent-client,
      # whose deps (bip39) resolve only from that package's own node_modules.
      # Without this they cannot load in CI and the test fails loudly (it
      # refuses to pass on a script that never started).
      - name: install agent-client (for script subprocess tests)
        working-directory: packages/agent-client
        run: bun install --frozen-lockfile

      # PUBLIC-SNAPSHOT TRIM (publish/CI-PUBLIC.md): step "instantiate gate (sheet ↔ generator ↔
      # blueprint)" removed — gen-instantiate-manifest.mjs ships as source (ruling N3 #2), but
      # --check also reads docs/ESCROW-PARAMETER-SHEET.md, which stays EXCLUDE.

      # PUBLIC-SNAPSHOT TRIM (publish/CI-PUBLIC.md): step "method catalog gate (inventory ↔
      # blueprint ABI)" removed — guild-app/scripts/gen-method-inventory.mjs was not named by
      # ruling N3 and stays wholesale-EXCLUDE under guild-app/scripts/**.

      - name: OpenAPI gate (public/openapi.json ↔ routes + zod schemas)
        working-directory: guild-app
        run: bun scripts/gen-openapi.mjs --check

      - name: unit + integration tests
        working-directory: guild-app
        run: bun run test

  agent-client:
    name: agent-client (unit + parity + types)
    # Was annotated "13.4s avg" when it moved to slim. That number is now stale by
    # this job's own doing: it gained a tsc build, a Node smoke and an npm
    # pack+install (2026-08-16), so it runs nearer a minute on slim's single core.
    # Slim is still the right runner — billing rounds every job UP to a whole
    # minute, so a 13s job and a 55s job cost the same and only the RATE matters
    # ($0.002/min vs $0.006). Still slim-COMPATIBLE: no `services:` block and no
    # `sudo` (pinned by guild-app/tests/unit/workflow-runners.test.ts).
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Full-repo checkout (default): the manifest byte-parity test imports
      # ../../../guild-app/src/lib/manifests — the money-path drift guard. Both
      # that file and its only dep (radix.ts) are pure/self-contained, so the
      # package's own deps resolve the whole chain; no guild-app install needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md

      - name: install
        working-directory: packages/agent-client
        run: bun install --frozen-lockfile

      # BUILD BEFORE TEST — order is load-bearing, not cosmetic. publish-manifest.test.ts
      # pins the exact packed tarball, which since 2026-08-16 includes 72 dist/ files,
      # and dist/ is gitignored. On a fresh checkout (i.e. every CI run) tests-then-build
      # reports all 72 as "removed" and the job fails on its own guard. Caught by an
      # adversarial screen; the local 329/329 that missed it had a stale dist/ lying around.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: build dist/ (tsc)
        working-directory: packages/agent-client
        run: bun run build

      - name: unit + manifest byte-parity tests
        working-directory: packages/agent-client
        run: bun test src/

      - name: type-check
        working-directory: packages/agent-client
        run: bun run type-check

      - name: node smoke — CLI runs and library imports under Node 20
        working-directory: packages/agent-client
        run: bun run smoke:node
      - name: pack + install into a scratch consumer under Node (bin symlink + import)
        working-directory: packages/agent-client
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp" >/dev/null
          cd "$tmp"
          printf '{"name":"consumer","private":true,"type":"module"}\n' > package.json
          npm install --no-audit --no-fund ./radix-guild-agent-client-*.tgz >/dev/null
          ./node_modules/.bin/guild-worker help | head -1
          node --input-type=module -e "import { GuildApiClient } from '@radix-guild/agent-client'; if (typeof GuildApiClient !== 'function') process.exit(1); console.log('consumer import ok')"
      # PUBLIC-SNAPSHOT TRIM (publish/CI-PUBLIC.md): step "the one-liner — npx -y -p <tarball
      # over HTTP> guild-agent, and its sha256" removed — packs through scripts/pack-kit.sh,
      # which ships (S1, 2026-09-30) but calls the EXCLUDEd scripts/publish-gate.mjs, so it
      # stops at the gate. The job keeps its plain `npm pack` + scratch-consumer step.

  alert-policy:
    name: alert-policy (unit + node smoke + pack)
    # The shared alert core (edge-triggered operator alerts) — zero-dependency,
    # so the whole job is install + bundle + bun test + tsc + a Node ESM/CJS
    # import smoke + pack-and-install into a scratch consumer. Slim-compatible:
    # no services, no sudo (pinned by guild-app/tests/unit/workflow-runners.test.ts).
    # guild-app carries a byte-for-byte vendored copy of src/ — its own suite
    # pins that parity (tests/unit/alert-core-parity.test.ts), so a policy edit
    # that lands in only one place fails this same run.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: install
        working-directory: packages/alert-policy
        run: bun install --frozen-lockfile
      - name: build dist/ (tsc d.ts + bun esm/cjs bundles)
        working-directory: packages/alert-policy
        run: bun run build
      - name: "unit tests (incl. the named defect — 1921 evaluations → 4 messages)"
        working-directory: packages/alert-policy
        run: bun test src/
      - name: type-check
        working-directory: packages/alert-policy
        run: bun run type-check
      - name: node smoke — ESM import + CJS require
        working-directory: packages/alert-policy
        run: bun run smoke:node
      - name: pack + install into a scratch consumer (ESM and CJS)
        working-directory: packages/alert-policy
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp" >/dev/null
          cd "$tmp"
          printf '{"name":"consumer","private":true}\n' > package.json
          npm install --no-audit --no-fund ./radix-guild-alert-policy-*.tgz >/dev/null
          node -e "const m = require('@radix-guild/alert-policy'); if (typeof m.createAlertEvaluator !== 'function') process.exit(1); console.log('cjs consumer ok')"
          node --input-type=module -e "import { decide } from '@radix-guild/alert-policy'; if (typeof decide !== 'function') process.exit(1); console.log('esm consumer ok')"

  bot:
    name: bot (unit tests)
    # The live Telegram bot (pm2 guild-bot), folded in from guild-public on
    # 2026-09-29 as a tree snapshot. Plain npm + CommonJS + `node --test`, no bun:
    # the job mirrors guild-public's own bot job (Node 22, npm ci, npm test) so
    # the fold changes where it runs, not how. npm ci pulls better-sqlite3's
    # prebuilt binary, so no compiler is needed. Slim-compatible (no services,
    # no sudo — pinned by guild-app/tests/unit/workflow-runners.test.ts).
    # Its name is a required status check on main: rename it only together with
    # the branch rules (the stuck "syntax check (bot)" story above is what a
    # half-done rename costs).
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: install
        working-directory: bot
        run: npm ci --no-audit --no-fund
      - name: unit tests
        working-directory: bot
        run: npm test

  agent-mcp:
    # The NAME is a required status check on main (guild-app/tests/unit/workflow-runners.test.ts
    # pins it) — it stays "unit + types" although P1 (2026-09-28) made the job do more: the
    # esbuild bundle, a Node stdio smoke, a pack through scripts/pack-kit.sh and the npx
    # one-liner over loopback HTTP. Was "11.1s avg"; nearer a minute now, still
    # slim-compatible (no services, no sudo).
    name: agent-mcp (unit + types)
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # agent-mcp depends on ../agent-client via file: (a devDependency since P1 —
      # the bundle inlines it, a consumer never installs it); importing it loads the
      # client's module graph, whose runtime deps resolve from the CLIENT's own
      # node_modules. So on a fresh checkout the client must be installed FIRST —
      # a lone `bun install` in agent-mcp is not self-sufficient (verified). And the
      # bundle resolves the client through its `import` export (dist/index.js), so
      # the client is BUILT before agent-mcp's build.
      - name: install + build agent-client
        working-directory: packages/agent-client
        run: bun install --frozen-lockfile && bun run build

      - name: install
        working-directory: packages/agent-mcp
        run: bun install --frozen-lockfile

      # BUILD BEFORE TEST: publish-manifest.test.ts pins the packed tarball, which
      # includes dist/guild-mcp.js (gitignored) — same ordering rule as agent-client.
      - name: build dist/guild-mcp.js (esbuild bundle, agent-client inlined)
        working-directory: packages/agent-mcp
        run: bun run build

      - name: unit + protocol + tarball-manifest tests
        working-directory: packages/agent-mcp
        run: bun test src/

      - name: type-check
        working-directory: packages/agent-mcp
        run: bun run type-check

      # The thing a person runs is a NODE process reading stdin, not a bun test over
      # an in-memory transport: spawn the bundle under Node 20 with the real MCP
      # client + stdio transport, list the 8 tools, call one no-network tool.
      - name: node smoke — the bundle speaks MCP over stdio under Node 20
        working-directory: packages/agent-mcp
        run: bun run smoke:node

      # PUBLIC-SNAPSHOT TRIM (publish/CI-PUBLIC.md): step "the one-liner — npx -y -p <tarball
      # over HTTP> guild-mcp, and its sha256" removed — packs through scripts/pack-kit.sh, which
      # ships (S1, 2026-09-30) but calls the EXCLUDEd scripts/publish-gate.mjs, so it stops at
      # the gate. The build, tarball-manifest tests and Node stdio smoke above it all stay.

  # PUBLIC-SNAPSHOT TRIM (publish/CI-PUBLIC.md): the private test.yml's `publish-gate` job is
  # removed whole — every step calls root scripts/publish-gate.mjs, which stays private by
  # design (the gate must stay unreadable from outside to stay ungameable). No public-safe
  # replacement exists.

  build:
    name: build (guild-app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md

      - name: install
        working-directory: guild-app
        run: bun install --frozen-lockfile

      - name: typecheck
        working-directory: guild-app
        run: bunx tsc --noEmit

      - name: next build
        working-directory: guild-app
        run: bun run build

  e2e:
    name: playwright e2e (guild-app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guild_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/guild_test
      # Required for boot alongside DATABASE_URL — see guild-app/.env.example:4.
      # auth.ts's getJwtSecret() throws "JWT_SECRET environment variable is not
      # set" the moment any route issues or verifies a session cookie, which
      # takes down the whole dev server the e2e suite runs against. Without this
      # line, every spec that signs in fails, and it fails as an opaque
      # [WebServer] Unhandled error rather than a test assertion. Test-only
      # value: it signs cookies for an ephemeral CI Postgres and nothing else.
      JWT_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse-anywhere-32b+
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Why this job is SKIPPED, never REMOVED, on a docs-only change ──────
      # `playwright e2e (guild-app)` is the most expensive job on the repo — 265
      # billed minutes across 75 runs on 2026-08-16, 22% of that day's billed
      # minutes, on a runner billed per job ROUNDED UP to a whole minute.
      #
      # ⛔ `paths-ignore` on this job is FORBIDDEN. Its name is a required
      # status check on main (`gh api
      # repos/{owner}/{repo}/branches/main/protection`). A required check
      # that is skipped never reports, and the PR then waits forever on
      # "Expected — waiting for status". That is unfalsifiable from inside the
      # PR — it looks like CI is merely slow. So the job always runs and always
      # reports; on a docs-only change it skips its expensive steps and finishes
      # inside its first billed minute. Ceiling on the saving is therefore
      # (average duration − 1 minute), never the whole job.
      #
      # FAIL-OPEN BY CONSTRUCTION: `run` starts true and only a positive,
      # confident docs-only determination flips it false. An API failure, an
      # empty file list, a force-push (all-zero `before`), or an unrecognised
      # event all run the full suite. A bug in this detection must cost one
      # minute, never a missed regression.
      #
      # Safe because e2e has NO docs-side input: the only `docs/` string under
      # tests/e2e is a citation inside a comment (cold-user.spec.ts:27). Do NOT
      # copy this to `unit` — that job carries the instantiate and
      # method-catalog drift gates which exist precisely to catch docs-side
      # edits, and filtering it would disarm them.
      #
      # ⚠️ SCOPE — this looks like a bug until you know it. On `pull_request`
      # the step reads the WHOLE PR DIFF (`/pulls/N/files`), not the commit that
      # was just pushed. So a PR containing ANY code runs the full suite on
      # every push to it, including a push that only edits a doc. That is
      # deliberate and CORRECT: CI on a PR validates the MERGE RESULT, and the
      # merge result contains the code. On `push` to main the compare is the
      # increment, so a docs-only merge does skip.
      # Measured 2026-08-17: 31% of the last 39 merged PRs were entirely
      # docs/*.md — those skip on every push. Observed live first, on a
      # docs-only push to PR #398 that ran the whole 176s suite and looked like
      # this step failing. It was not. Do not "fix" it into per-push scope.
      #
      # The pattern is deliberately narrow: only `docs/**.md` counts as
      # skippable. `docs/*.json` (ASSET-REGISTRY), root `*.md`, and everything
      # else run the suite.
      - name: is this docs-only?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run=true
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                      --paginate --jq '.[].filename') || { echo "gh api failed (exit $?) — failing OPEN"; files=""; }
          elif [ "${{ github.event_name }}" = "push" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" \
                      --paginate --jq '.files[].filename') || { echo "gh api failed (exit $?) — failing OPEN"; files=""; }
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/.+\.md$'; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "false" ]; then
            echo "::notice::docs-only change — browser suite skipped, check still reports."
            printf '%s\n' "$files"
          else
            echo "running the full browser suite — $(printf '%s\n' "$files" | grep -c . ) file(s) seen"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: 1.4.2 # pinned: bun.lock is v3 (nested overrides) — keep in step with local bun, see CLAUDE.md

      - name: install
        if: steps.scope.outputs.run == 'true'
        working-directory: guild-app
        run: bun install --frozen-lockfile

      - name: apply schema
        if: steps.scope.outputs.run == 'true'
        working-directory: guild-app
        run: bun run db:migrate

      - name: install playwright browsers
        if: steps.scope.outputs.run == 'true'
        working-directory: guild-app
        run: bunx playwright install --with-deps chromium

      - name: e2e tests
        if: steps.scope.outputs.run == 'true'
        working-directory: guild-app
        run: bun run test:e2e -- --project=chromium

      - name: upload playwright report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: guild-app/playwright-report/
          retention-days: 7

  # PUBLIC-SNAPSHOT TRIM (publish/CI-PUBLIC.md): the private test.yml's `docs` job is removed
  # whole — calls root scripts/docs-check.sh, which stays EXCLUDE (it has no purpose without the
  # rest of root scripts/**).
