# Label definitions for the dev board. Apply with:
#   gh label create <name> --color <hex> --description "<desc>" --force

# ── type ──────────────────────────────────────────────
- name: "type:task"
  color: "1d76db"
  description: "A unit of work"
- name: "type:decision"
  color: "d93f0b"
  description: "A choice only bigdev can make"
- name: "type:bug"
  color: "d73a4a"
  description: "Something broken in the app, the CI, or the docs"

# ── status (workflow: pick ONE at a time) ─────────────
- name: "status:pending"
  color: "ededed"
  description: "Not started"
- name: "status:in-progress"
  color: "fbca04"
  description: "Work in progress"
- name: "status:draft-ready"
  color: "0e8a16"
  description: "Draft written, awaiting maintainer review"
- name: "status:shipped"
  color: "5319e7"
  description: "Reviewed + tested + deployed by bigdev"
- name: "status:blocked"
  color: "b60205"
  description: "Waiting on a decision or another task"
- name: "status:needs-bigdev"
  color: "e99695"
  description: "Decision required from bigdev"

# ── phase ─────────────────────────────────────────────
- name: "phase:P1"
  color: "c5def5"
  description: "Pre-launch / Foundation"
- name: "phase:P2"
  color: "bfd4f2"
  description: "Robustness / Soft launch"
- name: "phase:P3"
  color: "d4c5f9"
  description: "Feature build"
- name: "phase:P4"
  color: "fef2c0"
  description: "Deploy"
- name: "phase:backlog"
  color: "ededed"
  description: "Not scheduled"

# ── who executes ─────────────────────────────────────
- name: "exec:mac"
  color: "0052cc"
  description: "Code, build and deploy work (maintainer-assigned)"
- name: "exec:vps"
  color: "006b75"
  description: "Research, design and draft work only (maintainer-assigned)"
- name: "exec:bigdev"
  color: "5319e7"
  description: "bigdev — decision / sign / deploy action"

# ── severity (for bugs) ───────────────────────────────
- name: "sev:critical"
  color: "b60205"
  description: "Money / security / launch blocker"
- name: "sev:high"
  color: "d93f0b"
  description: "Important, not blocking"
- name: "sev:medium"
  color: "fbca04"
  description: "Would surface in review"
- name: "sev:low"
  color: "0e8a16"
  description: "Nit"
