[package]
name = "guild-escrow"
version = "1.0.0"
edition = "2021"
description = "DEPRECATED 2026-05-23 — superseded by guild-marketplace-escrow. Retained as audit-time snapshot; see README.md."
license = "Apache-2.0"
publish = false

[dependencies]
scrypto = { version = "1.3.1" }

[dev-dependencies]
scrypto-test = { version = "1.3.1" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
overflow-checks = true

[features]
default = []

[lib]
crate-type = ["cdylib", "lib"]

[workspace]
