[package]
name = "guild-marketplace-escrow"
version = "0.1.0"
edition = "2021"
# Apache-2.0, not MIT and not dual. The express patent grant and its defensive
# termination clause are the reason: this crate is a money-handling blueprint
# published by a solo operator with no patent portfolio to counter-assert with.
# Offering `MIT OR Apache-2.0` (the usual Rust convention) would make that grant
# OPTIONAL — a licensee picks MIT and takes the code without the patent terms —
# which defeats the only reason to choose Apache here.
license = "Apache-2.0"

[dependencies]
scrypto = { version = "1.3.1" }

[dev-dependencies]
scrypto-test = { version = "1.3.1" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
overflow-checks = true

[features]
default = []

[lib]
crate-type = ["cdylib", "lib"]

[workspace]
