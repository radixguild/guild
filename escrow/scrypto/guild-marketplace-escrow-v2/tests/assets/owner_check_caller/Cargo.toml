# TEST-ONLY package. `tests/nft_swap.rs` and `tests/lib.rs` compile and publish
# it inside the scrypto-test ledger simulator to reach NftSwap `list` and the
# escrow's `create_task` / `claim_task` THROUGH A COMPONENT, which no manifest
# can do on its own. It is never built by the crate's `cargo build`, never
# deployed, and is not part of the guild-marketplace-escrow-v2 package.
[package]
name = "owner-check-caller"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
scrypto = { version = "1.3.1" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
overflow-checks = true

[lib]
crate-type = ["cdylib", "lib"]

# Its own workspace root, so cargo never treats it as a member of the parent
# crate's (empty) workspace.
[workspace]
